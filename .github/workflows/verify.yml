name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run package tests and build native targets
        run: scripts/check.sh
