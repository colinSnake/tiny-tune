      <stop offset="1" stop-color="#d39478"/>
    </radialGradient>
    <linearGradient id="edge">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".16" stop-color="white" stop-opacity=".2"/>
      <stop offset=".38" stop-color="white" stop-opacity=".87"/>
      <stop offset=".58" stop-color="white"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="360">
