<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="900" viewBox="0 0 390 300" role="img" aria-labelledby="title desc">
<title id="title">TinyTune · 晴川留白 · 日间竖屏顶部背景</title>
<desc id="desc">基于项目 Web 顶部卡片原始山水 SVG 重新编排；保留远山、落日、湖面、扁舟与松林，顶部右侧成景，左侧和内容区留白。原生 iOS 顶部装饰，内容区透明渐隐。</desc>
<defs>
    <linearGradient id="vapor" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#9ea99b" stop-opacity=".78"/>
      <stop offset=".8" stop-color="#c6ccbb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#eceddf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="middle" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#718b7f"/>
      <stop offset=".66" stop-color="#a6b8a9" stop-opacity=".63"/>
      <stop offset="1" stop-color="#e5e9dc" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="near" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#4e7065"/>
      <stop offset=".71" stop-color="#6f8c81" stop-opacity=".86"/>
      <stop offset="1" stop-color="#c6d4c5" stop-opacity=".29"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1" gradientUnits="objectBoundingBox">
