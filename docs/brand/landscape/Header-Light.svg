    </mask>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="13" stitchTiles="stitch"/>
    </filter>
    <g id="pine" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
